name: savingtracker 
services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: SavingTrackerDatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: SavingTracker.API/Dockerfile
    container_name: savingtracker-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Prodduction"
      ConnectionStrings__ConnectionString: "Host=postgres;Port=5432;Database=SavingTrackerDatabase;Username=dev;Password=dev123;SSL Mode=Disable"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  blazor:
    build:
      context: .
      dockerfile: SavingTracker.UI/SavingTracker.UI/Dockerfile
    container_name: savingtracker-blazor
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiBaseUrl: "http://api:8080"
      ASPNETCORE_URLS: "http://+:5000"
    ports:
      - "5000:5000"
    depends_on:
      - api

volumes:
  pgdata:
